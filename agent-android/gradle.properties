# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process

# Build cache + configuration cache for faster incremental CI builds.
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is mandatory for modern AndroidX libraries.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resources/BuildConfig fields we actually declare.
android.nonTransitiveRClass=true

# Disable the unused Jetifier (no legacy support libs in this scaffold).
android.enableJetifier=false
